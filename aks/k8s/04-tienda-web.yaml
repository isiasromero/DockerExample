# Servidor web Node.js: Deployment con 2 replicas expuesto por un LoadBalancer de Azure
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tienda-web
  namespace: tienda
spec:
  replicas: 2
  selector:
    matchLabels: { app: tienda-web }
  template:
    metadata:
      labels: { app: tienda-web }
    spec:
      containers:
        - name: web
          image: __ACR__/tienda-web:1.0
          envFrom:
            - configMapRef: { name: tienda-config }
          env:
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: tienda-secret, key: MYSQL_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: tienda-secret, key: MYSQL_PASSWORD } }
          ports: [{ containerPort: 3000 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /salud, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /salud, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tienda-web
  namespace: tienda
spec:
  type: LoadBalancer
  selector: { app: tienda-web }
  ports: [{ port: 80, targetPort: 3000 }]
